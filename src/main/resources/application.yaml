spring:
  application:
    name: CHURAI-BE
  
  config:
    import: "optional:file:.env[.properties]" # .env 파일 로드 설정 추가

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/churai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:churai1629@}
    password: ${SPRING_DATASOURCE_PASSWORD:churai1629@}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.MySQLDialect

  jackson:
    serialization:
      fail-on-empty-beans: false
    time-zone: Asia/Seoul

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    region:
      static: ${AWS_REGION}
      auto: false
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
    stack:
      auto: false

server:
  port: 8080
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: debug
